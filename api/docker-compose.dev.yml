services:
  mysql:
    image: mysql:8.0
    container_name: elegio_api_mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: elegio
      MYSQL_USER: elegio_user
      MYSQL_PASSWORD: elegio_password
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: elegio_phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: password
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql

volumes:
  mysql_data:
